name: deploy
on:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Builds one image per architecture on a native runner (QEMU emulation makes
  # the Rust and heaptrack builds far too slow), pushed untagged by digest.
  # The `publish` job combines the digests into one multi-platform manifest.
  build:
    name: build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Needed to push by digest, which the default docker driver does not support
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Solvers image metadata
        id: meta_solvers
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
      - name: Solvers image build
        id: build_solvers
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.binary
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta_solvers.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build_solvers.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags only move once both architectures built successfully.
  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Solvers image metadata
        id: meta_solvers
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.IMAGE }}
      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        env:
          METADATA: ${{ steps.meta_solvers.outputs.json }}
          VERSION: ${{ steps.meta_solvers.outputs.version }}
        run: |
          readarray -t args < <(jq -r '.tags[] | "--tag", .' <<< "$METADATA")
          for digest in *; do
            args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - uses: cowprotocol/autodeploy-action@v2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          images: ghcr.io/gnosis/solvers:main
          tag: ${{ secrets.AUTODEPLOY_TAG }}
          url: ${{ secrets.AUTODEPLOY_URL }}
          token: ${{ secrets.AUTODEPLOY_TOKEN }}
          timeout: 600000 # 10 minutes
